spring.datasource.url=jdbc:h2:mem:analytics;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.flyway.schemas=analytics
spring.flyway.default-schema=analytics
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.listener.auto-startup=false
users.service.url=http://localhost:18080
courses.service.url=http://localhost:18081
notifications.service.url=http://localhost:18082
