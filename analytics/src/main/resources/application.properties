spring.application.name=analytics
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/sdo_analytics_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sdo_user}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:sdo_password}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.default_schema=analytics
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.schemas=analytics
spring.flyway.default-schema=analytics

spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=analytics-service
spring.kafka.consumer.auto-offset-reset=earliest

users.service.url=${USERS_SERVICE_URL:http://localhost:8080}
courses.service.url=${COURSES_SERVICE_URL:http://localhost:8081}
notifications.service.url=${NOTIFICATIONS_SERVICE_URL:http://localhost:8080}
