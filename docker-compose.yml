services:
  postgres:
    image: postgres:15-alpine
    container_name: sdo-postgres
    environment:
      POSTGRES_USER: sdo_user
      POSTGRES_PASSWORD: sdo_password
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdo_user -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - sdo-network
      
  kafka:
    image: confluentinc/cp-kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 1
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - sdo-network

  redis:
    image: redis:7-alpine
    container_name: sdo-redis
    ports:
      - "6379:6379"
    networks:
      - sdo-network

  minio:
    image: minio/minio:latest
    container_name: sdo-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - sdo-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sdo-frontend
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://sdo_user:sdo_password@postgres:5432/sdo_users_db
      NODE_ENV: development
      PORT: 5000
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sdo-network

  auth:
    build:
      context: ./auth
      dockerfile: Dockerfile
    container_name: sdo-auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sdo_auth_db
      SPRING_DATASOURCE_USERNAME: sdo_user
      SPRING_DATASOURCE_PASSWORD: sdo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      USERS_SERVICE_URL: http://users:8080
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - sdo-network

  users:
    build:
      context: ./users
      dockerfile: Dockerfile
    container_name: sdo-users
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sdo_users_db
      SPRING_DATASOURCE_USERNAME: sdo_user
      SPRING_DATASOURCE_PASSWORD: sdo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      COURSES_SERVICE_URL: http://courses:8081
    depends_on:
      postgres:
        condition: service_healthy
      courses:
        condition: service_started
    networks:
      - sdo-network

  communication:
    build:
      context: ./communication
      dockerfile: Dockerfile
    container_name: sdo-communication
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sdo_communication_db
      SPRING_DATASOURCE_USERNAME: sdo_user
      SPRING_DATASOURCE_PASSWORD: sdo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      COURSES_SERVICE_URL: http://courses:8081
    depends_on:
      postgres:
        condition: service_healthy
      courses:
        condition: service_started
      kafka:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - sdo-network

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: sdo-gateway
    ports:
      - "8080:8080"
    environment:
      AUTH_SERVICE_URL: http://auth:8080
      USER_SERVICE_URL: http://users:8080
      COURSES_SERVICE_URL: http://courses:8081
      COMMUNICATION_SERVICE_URL: http://communication:8080
      ANALYTICS_SERVICE_URL: http://analytics:8080
      NOTIFICATION_SERVICE_URL: http://notifications:8080
      REDIS_HOST: redis
      CORS_ALLOWED_ORIGINS: http://localhost:5000
    depends_on:
      auth:
        condition: service_started
      users:
        condition: service_started
      courses:
        condition: service_started
      communication:
        condition: service_started
      analytics:
        condition: service_started
      notifications:
        condition: service_started
      redis:
        condition: service_started
    networks:
      - sdo-network

  notifications:
    build:
      context: ./notifications
      dockerfile: Dockerfile
    container_name: sdo-notifications
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sdo_notifications_db
      SPRING_DATASOURCE_USERNAME: sdo_user
      SPRING_DATASOURCE_PASSWORD: sdo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_started
    networks:
      - sdo-network

  analytics:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    container_name: sdo-analytics
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sdo_analytics_db
      SPRING_DATASOURCE_USERNAME: sdo_user
      SPRING_DATASOURCE_PASSWORD: sdo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      USERS_SERVICE_URL: http://users:8080
      COURSES_SERVICE_URL: http://courses:8081
      NOTIFICATIONS_SERVICE_URL: http://notifications:8080
    depends_on:
      postgres:
        condition: service_healthy
      users:
        condition: service_started
      courses:
        condition: service_started
      notifications:
        condition: service_started
      kafka:
        condition: service_started
    networks:
      - sdo-network
      
  courses:
    build:
      context: ./courses
      dockerfile: Dockerfile
    container_name: sdo-courses
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/sdo_courses_db
      SPRING_DATASOURCE_USERNAME: sdo_user
      SPRING_DATASOURCE_PASSWORD: sdo_password
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      USERS_SERVICE_URL: http://users:8080
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      REDIS_PORT: 6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_CERTIFICATES_BUCKET: sdo-certificates
      MINIO_COURSE_COVERS_BUCKET: sdo-course-covers
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - sdo-network

volumes:
  postgres_data:
  kafka-data:
  minio_data:

networks:
  sdo-network:
    driver: bridge
